apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-config
  namespace: ragops
data:
  DATA_DIR: /app/data/batch_a
  QUARANTINE_DIR: /app/persist/quarantine
  ARCHIVE_DIR: /app/persist/archive
  TRACE_DIR: /app/traces
  VECTOR_DIR: /app/data/vector_store
  COLLECTION: e3-before-b-500
  EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
  LLM_MODEL: Qwen/Qwen2.5-0.5B-Instruct
  TOP_K: "3"
  SIMILARITY_THRESHOLD: "0.28"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "50"
  SEED: "4032"
  HF_HUB_OFFLINE: "1"
  MODEL_CACHE_OFFLINE: "1"
  HF_HOME: /models
  LLM_DEVICE: cpu
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-gate
  namespace: ragops
data:
  gate.yaml: |
    version: 1
    rationale: >-
      Calibrated against the measured Kubernetes TOP_K=3 suite. Its p95 latency
      was 91226.9 ms; a 20 percent allowance is 109472.28 ms, rounded up to
      109500 ms for local CPU variation. Other thresholds follow gate.yaml.
    thresholds:
      max_recall_at_5_drop: 0.02
      min_faithfulness: 0.95
      min_citation_validity: 0.90
      max_p95_latency_ms: 109500
      require_abstention_not_below_baseline: true
