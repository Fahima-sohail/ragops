apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-eval
  namespace: ragops
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: evaluation
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eval.run_suite"]
          envFrom:
            - configMapRef:
                name: ragops-config
          volumeMounts:
            - name: persistent
              mountPath: /app/data/vector_store
              subPath: vector_store
              readOnly: true
            - name: persistent
              mountPath: /app/eval/results
              subPath: results
            - name: persistent
              mountPath: /app/traces
              subPath: traces
              readOnly: true
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: ragops-data
