apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-eval
  namespace: ragops
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: evaluation
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eval.run_suite"]
          envFrom:
            - configMapRef:
                name: ragops-config
          env:
            - name: EVAL_ALLOW_MISSING_GROUND_TRUTH
              value: "1"
            - name: EVAL_ALLOW_GROUND_TRUTH_DRIFT
              value: "1"
          volumeMounts:
            - name: persistent
              mountPath: /app/data/vector_store
              subPath: vector_store
            - name: persistent
              mountPath: /app/eval/results
              subPath: results
            - name: persistent
              mountPath: /app/traces
              subPath: traces
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 5Gi
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: ragops-data
