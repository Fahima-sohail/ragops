apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-ingest
  namespace: ragops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: ragops:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "rag.ingest", "--data", "/app/data/batch_a", "--collection", "e3-before-b-500"]
          envFrom:
            - configMapRef:
                name: ragops-config
          volumeMounts:
            - name: persistent
              mountPath: /app/data/batch_a
              subPath: batch_a
              readOnly: true
            - name: persistent
              mountPath: /app/data/vector_store
              subPath: vector_store
            - name: persistent
              mountPath: /app/persist/quarantine
              subPath: quarantine
            - name: persistent
              mountPath: /app/persist/archive
              subPath: archive
            - name: persistent
              mountPath: /app/eval/results
              subPath: results
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: ragops-data
