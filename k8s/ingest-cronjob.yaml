apiVersion: batch/v1
kind: CronJob
metadata:
  name: ragops-ingest
  namespace: ragops
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: ragops:v1
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "rag.ingest", "--data", "/app/data/batch_b", "--collection", "e3-before-b-500"]
              envFrom:
                - configMapRef:
                    name: ragops-config
              volumeMounts:
                - name: persistent
                  mountPath: /app/data/batch_b
                  subPath: batch_b
                - name: persistent
                  mountPath: /app/data/vector_store
                  subPath: vector_store
                - name: persistent
                  mountPath: /app/persist/quarantine
                  subPath: quarantine
                - name: persistent
                  mountPath: /app/persist/archive
                  subPath: archive
                - name: persistent
                  mountPath: /app/eval/results
                  subPath: results
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
          volumes:
            - name: persistent
              persistentVolumeClaim:
                claimName: ragops-data
