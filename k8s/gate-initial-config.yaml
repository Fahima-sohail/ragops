apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-gate-initial
  namespace: ragops
data:
  gate.yaml: |
    version: 1
    rationale: >-
      Original 36,500 ms ceiling from offline baseline C2; this was evaluated on the
      same Kubernetes baseline/candidate metrics before cluster recalibration.
    thresholds:
      max_recall_at_5_drop: 0.02
      min_faithfulness: 0.95
      min_citation_validity: 0.90
      max_p95_latency_ms: 36500
      require_abstention_not_below_baseline: true
