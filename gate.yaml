# Calibrated from C2 baseline eval/results/suite_20261126T155753Z.json: faithfulness
# was 1.00, so 0.95 permits a five-point decrease while requiring strong support.
# Baseline p95 was 30,392.909 ms. A 20% allowance is 36,471.491 ms, rounded up
# to a 36,500 ms ceiling for local CPU timing variation.
version: 1
rationale: >-
  The local CPU model measured 30,392.909 ms p95 on the TOP_K=3 baseline; the
  36,500 ms ceiling allows 20% runtime variation. Faithfulness and citation support
  are scored by the cached local LLM judge at temperature zero. Recall may lose at
  most two percentage points; abstention correctness cannot regress.
thresholds:
  max_recall_at_5_drop: 0.02
  min_faithfulness: 0.95
  min_citation_validity: 0.90
  max_p95_latency_ms: 36500
  require_abstention_not_below_baseline: true
